<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Street Squad</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #1d1b2e; }
  body { font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; }
  .hud { position: fixed; pointer-events: none; text-shadow: 0 2px 4px #000a; }
  #cards { top: max(8px, env(safe-area-inset-top)); left: 0; right: 0; display: flex; justify-content: center; gap: 8px; padding: 0 8px; }
  .hc { width: 112px; padding: 4px 8px 6px; border-radius: 10px; background: #0007; border-left: 4px solid var(--c); box-sizing: border-box; }
  .hc b { display: flex; justify-content: space-between; font-size: 12px; font-weight: 800; white-space: nowrap; overflow: hidden; }
  .hc b span:first-child { overflow: hidden; text-overflow: ellipsis; } .hc.me b span:first-child { color: #ffd23f; }
  .hc i { display: block; height: 7px; margin-top: 3px; border-radius: 4px; background: #ffffff26; overflow: hidden; }
  .hc i u { display: block; height: 100%; background: linear-gradient(90deg, #ff4d6d, #ffd23f); }
  .hc.out { opacity: .45; }
  #stage { top: calc(max(8px, env(safe-area-inset-top)) + 50px); left: 0; right: 0; text-align: center; font-size: 12px; font-weight: 700; opacity: .85; }
  #boss { top: calc(max(8px, env(safe-area-inset-top)) + 70px); left: 50%; transform: translateX(-50%); width: min(420px, 80vw); font-size: 13px; font-weight: 900; text-align: center; color: #ffb3c1; }
  #boss i { display: block; height: 10px; margin-top: 2px; border-radius: 5px; background: #ffffff22; overflow: hidden; } #boss i u { display: block; height: 100%; background: #ff3d6e; }
  #go { top: 42%; right: max(18px, env(safe-area-inset-right)); font: 900 40px/1 system-ui, sans-serif; color: #ffd23f; -webkit-text-stroke: 2px #5a2a00; animation: blink .8s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #msg { top: 28%; left: 0; right: 0; text-align: center; font: 900 60px/1 system-ui, sans-serif; color: #ffd23f; -webkit-text-stroke: 3px #5a2a00; transition: opacity .3s, transform .3s; opacity: 0; transform: scale(.85); }
  #msg small { display: block; margin-top: 8px; font-size: 20px; color: #fff; -webkit-text-stroke: 0; }
  #msg.on { opacity: 1; transform: scale(1); }
  #down { top: 52%; left: 0; right: 0; text-align: center; font-size: 20px; font-weight: 800; }
  #hint { left: 0; right: 0; bottom: calc(max(10px, env(safe-area-inset-bottom)) + 24px); text-align: center; font-size: 15px; font-weight: 700; padding: 0 14px; }
  #net { bottom: max(6px, env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center; font-size: 12px; opacity: .8; }
  #over { position: fixed; inset: 0; display: grid; place-items: center; background: #0d0b1ab0; }
  #over[hidden], #acts[hidden], #boss[hidden], #go[hidden], #down[hidden] { display: none; }
  .card { width: min(360px, 90vw); max-height: 86vh; overflow: auto; padding: 20px; border-radius: 16px; background: #26213f; border: 1px solid #ffffff2e; text-align: center; box-sizing: border-box; }
  .card h2 { margin: 0 0 4px; font-size: 27px; color: #ffd23f; } .card h3 { margin: 14px 0 4px; font-size: 13px; color: #ff9fd1; text-align: left; }
  .card ol { margin: 0; padding-left: 24px; font-size: 14px; text-align: left; }
  .card li span { float: right; font-variant-numeric: tabular-nums; } .card li.me { color: #ffd23f; font-weight: 700; }
  .card p { margin: 10px 0 0; font-size: 13px; opacity: .75; }
  button.go { width: 100%; min-height: 48px; margin-top: 16px; border: 0; border-radius: 12px; background: #ffd23f; color: #3a2400; font: 800 17px system-ui, sans-serif; cursor: pointer; }
  #acts { position: fixed; right: max(12px, env(safe-area-inset-right)); bottom: calc(max(14px, env(safe-area-inset-bottom)) + 18px); width: 196px; height: 150px; touch-action: none; }
  #acts button { position: absolute; width: 76px; height: 76px; border-radius: 50%; border: 2px solid #ffffff88; color: #fff; font: 800 14px system-ui, sans-serif; touch-action: none; }
  #acts button.on { filter: brightness(1.6); }
  #acts [data-k=punch] { right: 0; top: 0; width: 88px; height: 88px; background: #ff5d7377; }
  #acts [data-k=kick] { right: 96px; top: 30px; background: #4cc9f077; }
  #acts [data-k=jump] { right: 40px; top: 92px; width: 58px; height: 58px; background: #ffffff33; font-size: 12px; }
  body.touch #hint { bottom: calc(max(14px, env(safe-area-inset-bottom)) + 190px); }
  @media (max-width: 560px) { .hc { width: 86px; padding: 3px 6px 5px; } .hc b { font-size: 11px; } #msg { font-size: 44px; } }
</style>
<script src="https://cdn.multiplayeragent.com/sdk/mp.global.js"></script>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud" id="cards"></div>
<div class="hud" id="stage"></div>
<div class="hud" id="boss" hidden><span id="bossName"></span><i><u id="bossHp"></u></i></div>
<div class="hud" id="go" hidden>GO ➜</div>
<div class="hud" id="msg"></div>
<div class="hud" id="down" hidden></div>
<div class="hud" id="hint"></div>
<div class="hud" id="net">Connecting…</div>
<div id="acts" hidden><button data-k="punch">PUNCH</button><button data-k="kick">KICK</button><button data-k="jump">JUMP</button></div>
<div id="over" hidden><div class="card">
  <h2 id="overTitle"></h2><div id="overSub"></div>
  <h3>The squad</h3><ol id="results"></ol>
  <h3>Best scores</h3><ol id="board"><li>Loading…</li></ol>
  <button class="go" id="again">Play again</button><p id="next"></p>
</div></div>
<script>
/* ═══ STREET SQUAD · a Multiplayer Agent starter ════════════════════════════════════════
 * Punch and kick through waves of goons, then the boss. Co-op, 1–4 players; AI buddies fill the squad.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ health, speeds, timers, the MOVES, the ENEMIES, the WAVES and the STAGES
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   FIGHTERS ...... walking, jumping, the punch combo and kicks, getting hurt (people and buddies alike)
 *   GAME (HOST) ... areas, waves, the goons' and boss's brains, food drops, scores, AI buddies.
 *                   Only the host runs this and writes shared state.
 *   ME ............ my controls, my hits, my health. Each player writes only its own.
 *   DRAW .......... the street, the fighters (drawn from shapes, posed by what they're doing), effects
 *   HUD & RESULTS . health cards, the boss bar, banners, results, leaderboard
 *   INPUT ......... keyboard, and touch (drag on the left to move, buttons on the right)
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - The HOST is the lowest sessionId among live players (heartbeat `hb` seen in the last 3s),
 *     worked out every frame. The host's browser runs the goons, the boss and the AI buddies.
 *   - The host writes `game` (ONE JSON field: id, version v, stage, area, phase walk|fight|clear|
 *     over, where the squad may walk, timers, everyone's score, food awards), `mobs` (every goon,
 *     ~10/s), `loot` (food on the ground) and `bots` (the AI buddies). A new host adopts all of it.
 *   - Each player writes its OWN entity: `p` (position, facing, what it's doing, health, down)
 *     about 12 times a second, `n`/`c` (name, color) and `hb` once a second.
 *   - Your own punches and kicks: when one lands on a goon on your screen you send "hit"
 *     {m, d, kd, dir}; the host checks you're close, takes the health off and adds your score.
 *   - Goons hit people with a "hurt" {to, d, kd, dir} event; the one hurt takes it off its own health.
 *   - Other intents: "pick" {i} (grab food; the first to ask gets it, recorded in game.awards)
 *     and "again" (a new run from the results card).
 *   - ?attract plays offline with buddies only (the preview video is recorded from it).
 *   - Leaderboard "street-score": each player's best score, shown on the results card.
 */

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  seats: 3,              // AI buddies fill the squad up to this many fighters
  hp: 100,               // everyone's health
  walkX: 210,            // walking speed along the street, units/s (the screen is about 960 units wide)
  walkZ: 125,            // walking speed up and down the street
  jump: 540, gravity: 1500,
  comboWindow: 0.35,     // seconds after a punch to chain the next one: jab, jab, hook
  downMs: 1000,          // ms on the floor after a knockdown
  reviveMs: 6000,        // knocked out: back up after this, as long as someone is still standing
  safeMs: 1300,          // ms nothing can hit you after you get up
  foodChance: 0.18,      // chance a goon drops food
  foodHeal: 40,          // health one plate of food gives back
  clearMs: 8000,         // ms the "stage clear" card shows before the next stage
  overMs: 11000,         // ms the "game over" card shows before a new run
  growth: 0.25,          // goons get this much tougher each stage
  board: "street-score",
};
// Attacks: when they hurt (seconds after you press), how far they reach, damage, knockdown.
const MOVES = {
  jab:   { time: 0.24, from: 0.06, to: 0.14, reach: 56, dmg: 6,  kd: false, next: "jab2" },
  jab2:  { time: 0.24, from: 0.06, to: 0.14, reach: 56, dmg: 6,  kd: false, next: "hook" },
  hook:  { time: 0.40, from: 0.12, to: 0.22, reach: 60, dmg: 11, kd: true },
  kick:  { time: 0.46, from: 0.17, to: 0.30, reach: 74, dmg: 12, kd: true },
  jkick: { time: 9,    from: 0.06, to: 9,    reach: 70, dmg: 14, kd: true },  // a flying kick: hurts until you land
};
// Goons. speed in units/s, wind = seconds of wind-up you can see before they swing, cool = rest between swings.
const ENEMIES = {
  punk:  { name: "Punk",     hp: 34,  speed: 90,  wind: 0.42, dmg: 8,  reach: 56, kd: false, size: 1,    skin: "#e8b48a", shirt: "#5b7a6b", pants: "#2b2f45", hair: "#2b2140", cool: [0.7, 1.5], points: 100 },
  slick: { name: "Slick",    hp: 24,  speed: 130, wind: 0.28, dmg: 6,  reach: 62, kd: false, size: 0.95, skin: "#c98f65", shirt: "#c0392b", pants: "#3b2a2a", hair: "#111111", cool: [0.7, 1.4], points: 120, dash: 160 },
  brute: { name: "Brute",    hp: 85,  speed: 58,  wind: 0.65, dmg: 14, reach: 66, kd: true,  size: 1.3,  skin: "#d9a37a", shirt: "#7a5a3a", pants: "#3a3a4a", hair: "#5a3a1a", cool: [1.2, 2.2], points: 250 },
  boss:  { name: "The Boss", hp: 300, speed: 72,  wind: 0.5,  dmg: 11, reach: 76, kd: false, size: 1.55, skin: "#e0aa80", shirt: "#6a3fa0", pants: "#24203a", hair: "#1a1a1a", cool: [0.8, 1.5], points: 1500, boss: true },
};
// One wave per area of the street; the last area is the boss. One more goon joins for every extra player.
const WAVES = [["punk", "punk", "punk"], ["punk", "slick", "punk", "slick"], ["brute", "punk", "slick", "punk"], ["boss", "punk", "punk"]];
const STAGES = [ // the street's look; it loops, a little tougher each time
  { name: "Downtown",       sky: ["#76c2ff", "#ffe8bd"], bld: ["#c96b5b", "#d9a05b", "#7d8fb3", "#b07cc6"], road: "#4c5062", walk: "#a2a0b0", lit: 0 },
  { name: "Harbor at dusk", sky: ["#ff8a5b", "#ffd28a"], bld: ["#8a5a6b", "#a86b4a", "#5b6b8a", "#7a5a8a"], road: "#45414f", walk: "#8d8496", lit: 0.45 },
  { name: "Neon Alley",     sky: ["#0d0b2a", "#3a1f5a"], bld: ["#2a2350", "#352a5e", "#1f2b4f", "#3b2350"], road: "#28263b", walk: "#3d3b56", lit: 1 },
];
const AREA = 1000, DEPTH = 150; // each area is 1000 units long; the street is 150 units deep (z)
const BOT_NAMES = ["Rex", "Juno", "Blaze", "Kit"];
const COLORS = ["#ff5d73", "#4cc9f0", "#ffd23f", "#06d6a0", "#c77dff", "#ff9f1c", "#f15bb5", "#9bdc5b"];

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'street-squad',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];
  let queued = false;
  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),
    onState: (f) => { subs.push(f); f(state); }, onJoin() {}, onLeave() {}, on() {}, send() {},
    onDisconnect() {}, onReconnect() {}, leave: async () => {},
  };
}
async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);
    return localRoom();
  }
}
const parse = (v, fb) => { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch { return fb; } };
const parsed = new Map();
/** A JSON value from state, parsed once per change (read-only: never mutate what this returns). */
function parseOnce(key, raw, fallback) {
  const c = parsed.get(key);
  if (c && c.raw === raw) return c.v;
  const v = parse(raw, fallback); parsed.set(key, { raw, v }); return v;
}
const shared = (key, fallback) => parseOnce("s:" + key, S.shared[key], fallback);
let net = null, S = { entities: { players: {} }, shared: {} };
const seenHb = new Map();
/** Players whose heartbeat moved in the last 3s (plus us), sorted by sessionId. */
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }
  return out.sort();
}
const isHost = () => livePlayers()[0] === net.sessionId;
const humansHere = () => livePlayers().filter((id) => !(ATTRACT && id === net.sessionId));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);

// ── FIGHTERS ────────────────────────────────────────────────────────────────────────
// x runs along the street, z is depth (0 = the back, by the buildings), y is height off the ground.
function newHero(id, name, color, x, z) {
  return { id, name, color, x, z, y: 0, vx: 0, vz: 0, vy: 0, f: 1, st: "idle", stT: 0, mv: "", sq: 0, chain: "jab", comboUntil: 0, buffer: 0,
    hitSet: new Set(), hp: CONFIG.hp, mhp: CONFIG.hp, dn: false, reviveAt: 0, inv: 0, gameId: -1 };
}
function setSt(f, st) { if (f.st !== st) { f.st = st; f.stT = 0; } }
function startMove(h, mv) { h.st = "atk"; h.mv = mv; h.stT = 0; h.sq = (h.sq + 1) % 1000; h.hitSet = new Set(); if (mv === "jkick") h.vx = h.f * CONFIG.walkX * 1.3; }
/** The attack that can hurt right now (during its active frames), or null. */
function activeMove(f) { if (f.st !== "atk") return null; const M = MOVES[f.mv]; return M && f.stT >= M.from && f.stT <= M.to ? M : null; }
/** Is `t` in front of `a`, within `reach`, on about the same depth and height? */
function inReach(a, reach, t, high = 60) {
  const dx = (t.x - a.x) * a.f;
  return dx > -14 && dx < reach + 16 * (t.size || 1) && Math.abs(t.z - a.z) < 24 && Math.abs((a.y || 0) - (t.y || 0)) < high;
}
const canBeHit = (f) => !f.dn && f.st !== "down" && f.st !== "up" && f.st !== "dead" && Date.now() >= (f.inv || 0);
function clampHero(h, g) { h.x = clamp(h.x, g.min + 30, g.lock - 30); h.z = clamp(h.z, 0, DEPTH); }
/** One step for a hero (you or a buddy). input = { x, z (-1..1), punch, kick, jump (pressed this step) }. Returns an event or null. */
function stepHero(h, inp, dt, g) {
  h.stT += dt;
  const now = Date.now();
  if (h.st === "down") { // knocked down: slide, lie there, get up (or stay out until revived)
    h.x += h.vx * dt; h.vx *= Math.pow(0.02, dt); clampHero(h, g);
    if (h.dn) { if (now >= h.reviveAt && g.phase !== "over") { h.dn = false; h.hp = Math.round(h.mhp * 0.5); setSt(h, "up"); h.inv = now + CONFIG.safeMs; return "revive"; } }
    else if (h.stT > CONFIG.downMs / 1000) { setSt(h, "up"); h.inv = now + CONFIG.safeMs; }
    return null;
  }
  if (h.st === "up") { if (h.stT > 0.35) setSt(h, "idle"); return null; }
  if (h.st === "hurt") { h.x += h.vx * dt; h.vx *= Math.pow(0.01, dt); clampHero(h, g); if (h.stT > 0.28) setSt(h, "idle"); return null; }
  let ev = null;
  const air = h.y > 0, busy = h.st === "atk";
  if (!air) {
    if (busy) { h.vx *= Math.pow(0.0005, dt); h.vz = 0; }
    else { h.vx = inp.x * CONFIG.walkX; h.vz = inp.z * CONFIG.walkZ; if (inp.x) h.f = Math.sign(inp.x); }
    if (inp.jump && !busy) { h.vy = CONFIG.jump; h.y = 0.01; ev = "jump"; }
  }
  if (inp.kick && h.y > 0 && !busy) { startMove(h, "jkick"); ev = "swing"; }
  else if (inp.kick && !air && !busy) { startMove(h, "kick"); ev = "swing"; }
  else if (inp.punch && !air) {
    if (!busy) { startMove(h, now < h.comboUntil ? h.chain : "jab"); ev = "swing"; }
    else if (h.mv !== "kick") h.buffer = now + 260; // pressed mid-punch: the next one in the combo follows
  }
  if (h.st === "atk" && h.mv !== "jkick" && h.stT >= MOVES[h.mv].time) { // the punch or kick is done
    const M = MOVES[h.mv]; h.chain = M.next || "jab"; h.comboUntil = M.next ? now + CONFIG.comboWindow * 1000 : 0; setSt(h, "idle");
    if (h.buffer > now && M.next) { h.buffer = 0; startMove(h, M.next); ev = "swing"; }
  }
  h.x += h.vx * dt; h.z += h.vz * dt;
  if (h.y > 0) { h.vy -= CONFIG.gravity * dt; h.y += h.vy * dt; if (h.y <= 0) { h.y = 0; h.vy = 0; ev = "land"; if (h.st === "atk") setSt(h, "idle"); } }
  if (h.st !== "atk") setSt(h, h.y > 0 ? "air" : Math.abs(h.vx) + Math.abs(h.vz) > 5 ? "walk" : "idle");
  clampHero(h, g);
  return ev;
}
/** A hero takes a hit: health down, then flinch, get knocked down, or go down for good (until revived). */
function hurtHero(h, d, kd, dir) {
  if (!canBeHit(h)) return false;
  h.hp = Math.max(0, h.hp - d); h.vx = dir * (kd ? 260 : 120); h.y = 0; h.vy = 0; h.buffer = 0;
  if (h.hp <= 0) { setSt(h, "down"); h.dn = true; h.reviveAt = Date.now() + CONFIG.reviveMs; }
  else { h.st = kd ? "down" : "hurt"; h.stT = 0; }
  return true;
}

// ── GAME (HOST) ─────────────────────────────────────────────────────────────────────
const host = { acting: false, last: null, mobs: [], loot: [], bots: new Map(), nextId: 1, dirty: false, lastG: 0, lastM: 0, lastB: 0, again: false };
/** The run as state has it, or the host's own newer write that hasn't come back yet. `v` only goes up. */
function game() {
  const g = shared("game", null);
  return host.last && isHost() && (!g || host.last.v > g.v) ? host.last : g;
}
function writeGame(g) { g = { ...g, v: (game()?.v ?? 0) + 1 }; host.last = g; host.dirty = false; host.lastG = performance.now(); net.setShared("game", JSON.stringify(g)); return g; }
/** Change the run and write it soon (scores change often: at most a few writes a second). */
function editGame(change) { const g = game(); host.last = { ...g, ...change(g), v: g.v + 1 }; host.dirty = true; }
const mobList = () => (host.acting ? host.mobs : shared("mobs", []).map(([i, t, x, z, y, f, st, hp, mhp]) => ({ i, t, x, z, y, f, st, hp, mhp })));
const lootList = () => (host.acting ? host.loot : shared("loot", []).map(([i, x, z]) => ({ i, x, z })));
const botWire = (b) => ({ i: b.id, n: b.name, c: b.color, x: Math.round(b.x), z: Math.round(b.z), y: Math.round(b.y), f: b.f, st: b.st, mv: b.mv, sq: b.sq, hp: Math.round(b.hp), dn: b.dn ? 1 : 0 });
const botList = () => (host.acting ? [...host.bots.values()].map(botWire) : shared("bots", []));
function newRun(id) {
  const t = Date.now();
  host.mobs = []; host.loot = [];
  return { id, run: id, stage: 1, area: 0, phase: "walk", min: 0, lock: AREA, endsAt: 0, startAt: t, score: {}, names: {}, awards: [] };
}
/** Become host: take over the run, the goons, the food and the buddies exactly as state has them. */
function adopt() {
  host.acting = true; host.last = null;
  const g = shared("game", null);
  host.mobs = shared("mobs", []).map(([i, t, x, z, y, f, st, hp, mhp]) => ({ i, t, x, z, y, f, st: st === "dead" ? "dead" : st === "down" || st === "up" ? st : "walk", stT: 0, hp, mhp, cd: 1, vx: 0, vy: 0 }));

  o.connect(gn).connect(actx.destination); o.start(t); o.stop(t + dur);
}

// ── INPUT ───────────────────────────────────────────────────────────────────────────
const keys = new Set(), touchUI = matchMedia("(pointer: coarse)").matches && !ATTRACT;
$("acts").hidden = !touchUI;
document.body.classList.toggle("touch", touchUI);
const wake = () => { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch {} } };
const ACTS = { j: "punch", x: "punch", k: "kick", z: "kick", " ": "jump", c: "jump" };
addEventListener("keydown", (e) => {
  wake(); const k = e.key.toLowerCase();
  if (k === " " || k.startsWith("arrow")) e.preventDefault();
  if (ACTS[k] && !e.repeat) input[ACTS[k]] = true;
  keys.add(k); readKeys();
});
addEventListener("keyup", (e) => { keys.delete(e.key.toLowerCase()); readKeys(); });
addEventListener("blur", () => { keys.clear(); readKeys(); });
function readKeys() {
  if (stick.id !== null) return;
  input.x = (keys.has("d") || keys.has("arrowright") ? 1 : 0) - (keys.has("a") || keys.has("arrowleft") ? 1 : 0);
  input.z = (keys.has("s") || keys.has("arrowdown") ? 1 : 0) - (keys.has("w") || keys.has("arrowup") ? 1 : 0);
}
// Touch: drag anywhere on the left side for a thumb stick; buttons on the right.
const stick = { id: null, x: 0, y: 0 };
cv.addEventListener("pointerdown", (e) => { e.preventDefault(); wake(); if (e.pointerType === "mouse" || e.clientX > W * 0.55) return; stick.id = e.pointerId; stick.x = e.clientX; stick.y = e.clientY; cv.setPointerCapture(e.pointerId); });
cv.addEventListener("pointermove", (e) => { if (e.pointerId !== stick.id) return; const dx = e.clientX - stick.x, dy = e.clientY - stick.y, d = Math.hypot(dx, dy); input.x = d > 10 ? clamp(dx / 40, -1, 1) : 0; input.z = d > 10 ? clamp(dy / 40, -1, 1) : 0; });
for (const ev of ["pointerup", "pointercancel"]) cv.addEventListener(ev, (e) => { if (e.pointerId === stick.id) { stick.id = null; input.x = input.z = 0; } });
function drawStick() { if (stick.id === null) return; ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.strokeStyle = "#ffffff66"; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(stick.x, stick.y, 40, 0, 7); ctx.stroke(); ctx.fillStyle = "#ffffff55"; ctx.beginPath(); ctx.arc(stick.x + input.x * 40, stick.y + input.z * 40, 18, 0, 7); ctx.fill(); }
for (const b of document.querySelectorAll("#acts button")) {
  const k = b.dataset.k;
  b.addEventListener("pointerdown", (e) => { e.preventDefault(); wake(); input[k] = true; b.classList.add("on"); });
  for (const ev of ["pointerup", "pointercancel", "pointerleave"]) b.addEventListener(ev, () => b.classList.remove("on"));
}
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
let last = performance.now(), lastHb = 0, lastHud = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now; // the first frame can be timed before load: never negative
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixColor(); }
  if (isHost()) hostTick(dt, now); else host.acting = false;
  const g = game();
  syncViews(dt);
  if (g) {
    myTick(dt, g);
    tickFx(dt);
    draw(g, now, dt);
    if (now - lastHud > 120) { lastHud = now; hud(g); }
  }
}

(async function start() {
  net = await connect();
  net.onState((st) => { S = st; });
  net.on("hit", (msg, from) => { if (host.acting && msg) applyHit(msg, from); });
  net.on("pick", (msg, from) => { if (host.acting && msg) applyPick(msg, from); });
  net.on("again", () => { if (host.acting) host.again = true; });
  net.on("hurt", (msg) => {
    if (!msg) return;
    if (msg.to === me.id && hurtHero(me, clamp(Number(msg.d) || 0, 0, 30), !!msg.kd, Math.sign(Number(msg.dir)) || 1)) { shake = msg.kd ? 14 : 7; sfx("ouch"); hitFx(me.x, me.z, 70, "#ff4d6d"); publish(true); }
    else { const v = views.get(msg.to); if (v) hitFx(v.x, v.z, 70, "#ff4d6d"); }
  });
  net.onDisconnect(() => { reconnecting = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { reconnecting = false; });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const taken = new Set([...Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c), ...shared("bots", []).map((b) => b.c)]);
  me.id = net.sessionId; me.color = COLORS.find((c) => !taken.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  net.me.set({ n: myName, c: me.color, hb: Date.now() });
  if (ATTRACT) { // the preview starts in a brawl: the second area, goons already close
    Object.assign(CONFIG, { seats: 3, reviveMs: 2000 });
    adopt();
    const g = writeGame({ ...newRun(1), area: 1, min: AREA, lock: 2 * AREA });
    spawnWave(g, 2); spawnWave(g, 3); // a crowd and The Boss
    host.mobs.forEach((m, k) => { m.x = AREA + 420 + (k % 2 ? -1 : 1) * (150 + k * 28); m.cd = 0.5 + k * 0.3; m.hp = m.mhp = Math.round(m.mhp * 1.5); if (ENEMIES[m.t].boss) { m.x = AREA + 700; m.chargeAt = Date.now() + 2500; } });
    writeGame({ ...game(), phase: "fight" });
  }
  startedAt = performance.now();
  requestAnimationFrame(frame);
})();
</script>
